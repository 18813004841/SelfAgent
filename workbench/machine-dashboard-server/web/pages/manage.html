<h1>管理</h1>
<p class="muted">查看本地工作台的运行资源与配置状态。</p>
<div class="stats">
  <div class="card">
    <div class="label">本机</div>
    <h2 id="manage-machines">加载中...</h2>
  </div>
  <div class="card">
    <div class="label">已注册工具</div>
    <h2 id="manage-tools">加载中...</h2>
  </div>
  <div class="card">
    <div class="label">定时任务</div>
    <h2 id="manage-schedules">加载中...</h2>
  </div>
</div>
<button type="button" class="card manage-entry" data-page="central-server">
  <h3>中央服务器管理</h3>
  <p class="muted">进入中央服务器与客户端管理</p>
</button>
<button type="button" class="card manage-entry" data-page="openai-agent">
  <h3>OpenAiAgent 管理</h3>
  <p class="muted">进入 Agent 网关与单轮对话</p>
</button>
<button type="button" class="card manage-entry" data-page="local-codex">
  <h3>本地 Codex</h3>
  <p class="muted">配置并调用本机 Codex App Server</p>
</button>
<div class="card manage-actions">
  <h3>管理操作</h3>
  <button type="button" class="primary" data-page="manage">刷新数据</button>
  <button type="button" data-page="scheduler">打开定时任务</button>
  <button type="button" data-page="settings">打开设置</button>
  <p id="manage-msg" class="muted"></p>
</div>
