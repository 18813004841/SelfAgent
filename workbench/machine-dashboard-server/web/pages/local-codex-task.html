<h1>Codex 任务</h1>
</p>
<div class="card">
  <h2 id="codex-task-title">任务</h2>
  <label for="codex-task-workspace">工程工作区</label>
  <input id="codex-task-workspace" type="text" class="codex-workspace" placeholder="例如 E:\\Projects\\my-project" />
  <div id="codex-task-skills"><label>Skill 路径</label></div>
  <button type="button" id="codex-task-add-skill">添加 Skill 路径</button>
  <label class="codex-extra-rules"><input id="codex-task-extra-rules" type="checkbox" /> 允许 Skill 以外的规则检查</label>
  <button type="button" id="codex-task-save-settings">保存设置</button><span id="codex-task-settings-status" class="muted codex-settings-status"></span>
  <div class="codex-prompt-wrap"><textarea id="codex-task-prompt" rows="6" class="codex-prompt" placeholder="输入 @ 选择 Skill，或直接描述任务"></textarea><div id="codex-task-skill-menu" hidden class="codex-skill-menu"></div></div>
  <button type="button" class="primary" id="codex-task-submit">提交任务</button>
  <button type="button" id="codex-task-cancel" hidden>取消执行</button>
  <p id="codex-task-status" class="muted"></p>
  <div id="codex-task-log"></div>
</div>
