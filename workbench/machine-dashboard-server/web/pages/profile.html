<h1>用户中心</h1>
<div class="card profile-card">
  <h2>账号信息</h2>
  <dl class="profile-details">
    <div><dt>用户名</dt><dd id="profile-username">加载中...</dd></div>
    <div><dt>显示名</dt><dd id="profile-display">加载中...</dd></div>
    <div><dt>权限</dt><dd id="profile-role">加载中...</dd></div>
  </dl>
  <button id="profile-logout" class="primary" type="button">退出登录</button>
  <p id="profile-msg" class="muted" role="status"></p>
</div>
