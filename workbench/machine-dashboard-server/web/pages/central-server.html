<h1>中央服务器管理</h1>
<p class="muted">管理中央服务器及其客户端进程。</p>
<div class="card">
  <h2>中央服务器客户端连接</h2>
  <p>
    连接状态：
    <b id="central-client-connection-status"> 检查中... </b>
  </p>
  <p>
    客户端 IP：
    <span id="central-server-ips" class="connection-ips"> 检查中... </span>
  </p>
</div>
<div class="card manage-actions">
  <div class="service-bar">
    <div class="service-item">
      <h2>中央服务器</h2>
      <p>
        当前状态：
        <b id="central-server-status"> 检查中... </b>
        · 端口
        <span id="central-server-port"> 18765 </span>
      </p>
      <button type="button" class="primary" id="central-server-start">启动中央服务器</button>
      <button type="button" id="central-server-stop">关闭中央服务器</button>
      <button type="button" id="central-server-cleanup">清理端口进程</button>
      <p id="central-server-msg" class="muted"></p>
    </div>
    <div class="service-item">
      <h2>中央服务器客户端（本机）</h2><label>本机连接的中央服务器 <input id="central-client-server" type="url" placeholder="http://服务器地址:18765" style="width:100%"></label>
      <p>
        当前状态：
        <b id="central-client-status"> 检查中... </b>
      </p>
      <p>
        本地文件：
        <b id="central-client-files"> 检查中... </b>
      </p>
      <p class="muted" id="central-client-dir"></p>
      <button type="button" class="primary" id="central-client-start">启动客户端</button>
      <button type="button" id="central-client-stop">关闭客户端</button>
      <button type="button" id="central-client-open" title="打开本地文件夹">📁</button>
      <a class="button-link" id="central-client-download" href="#">
        下载客户端
      </a>
      <span id="central-client-update" class="muted"></span>
      <p id="central-client-msg" class="muted"></p>
    </div>
  </div>
</div>
