<h1>Jenkins 管理</h1>
<p class="muted">管理 Jenkins 地址，查看服务与中央服务器连接状态。</p>
<section class="card">
  <h2 id="jenkins-form-title">添加 Jenkins</h2>
  <form id="jenkins-form">
    <label>IP 地址 <input id="jenkins-ip" required placeholder="例如 192.168.1.10"></label>
    <label>协议 <select id="jenkins-scheme"><option value="http">HTTP</option><option value="https">HTTPS</option></select></label>
    <label>端口 <input id="jenkins-port" type="number" min="1" max="65535" value="8080" required></label>
    <button type="submit" class="primary" id="jenkins-save">添加</button>
    <button type="button" id="jenkins-cancel" hidden>取消修改</button>
  </form>
  <p id="jenkins-message" role="status" aria-live="polite"></p>
</section>
<section class="card">
  <h2>Jenkins 列表</h2>
  <p id="jenkins-list-status" role="status">加载中...</p>
  <div id="jenkins-list"></div>
</section>
<section class="card" id="jenkins-users" hidden>
  <h2>用户管理</h2>
  <div role="tablist" aria-label="用户管理"><button type="button" role="tab" id="jenkins-register-tab" aria-selected="true" aria-controls="jenkins-register-panel">注册账号</button> <button type="button" role="tab" id="jenkins-permissions-tab" aria-selected="false" aria-controls="jenkins-permissions-panel">权限管理</button></div>
  <div role="tabpanel" id="jenkins-register-panel" aria-labelledby="jenkins-register-tab">
    <p class="muted">对所选 Jenkins 使用自助注册；需要验证码或未开放注册时请到对应 Jenkins 操作。</p>
    <form id="jenkins-register-form">
      <fieldset><legend>选择 Jenkins</legend><div id="jenkins-register-targets">加载中...</div></fieldset>
      <label>用户名 <input id="jenkins-register-username" required autocomplete="off"></label>
      <label>全称 <input id="jenkins-register-fullname" required autocomplete="off"></label>
      <label>邮箱 <input id="jenkins-register-email" type="email" autocomplete="off"></label>
      <label>密码 <input id="jenkins-register-password" type="password" required autocomplete="new-password"></label>
      <label>确认密码 <input id="jenkins-register-confirm" type="password" required autocomplete="new-password"></label>
      <button class="primary" type="submit" id="jenkins-register-submit">注册账号</button>
    </form>
    <p id="jenkins-register-message" role="status" aria-live="polite"></p>
    <ul id="jenkins-register-results"></ul>
  </div>
  <div role="tabpanel" id="jenkins-permissions-panel" aria-labelledby="jenkins-permissions-tab" hidden>
    <p class="muted">每台 Jenkins 单独管理用户权限和 qa、admin 方案。用户组及其他授权仍可能影响实际权限。</p>
    <form id="jenkins-permissions-search"><label>用户名 <input id="jenkins-permissions-username" required></label> <button class="primary" type="submit">搜索</button></form>
    <p id="jenkins-permissions-message" role="status" aria-live="polite"></p>
    <div class="jenkins-permissions-toolbar"><button type="button" id="jenkins-profile-refresh">刷新 Jenkins 列表和方案</button><span id="jenkins-profile-message" role="status" aria-live="polite"></span></div>
    <div id="jenkins-permissions-results"></div>
  </div>
</section>
