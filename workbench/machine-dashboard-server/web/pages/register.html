<div class="card" style="max-width:420px;margin:12vh auto"><h1>注册账号</h1><form id="register-form"><label>用户名<input id="register-username" autocomplete="username" minlength="3" maxlength="64" required></label><label>显示名<input id="register-display"></label><label>密码<input id="register-password" type="password" minlength="6" autocomplete="new-password" required></label><button class="primary" type="submit">注册</button><button type="button" id="back-login">返回登录</button><p id="register-msg" class="muted"></p></form></div>
