<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
<defs><style>
.t{font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif;fill:#20302d}.muted{fill:#6c7e78}.small{font-size:13px}.label{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#6c7e78}.h{font-size:22px;font-weight:700}.body{font-size:14px}.mono{font-family:Consolas,monospace;font-size:12px;fill:#b9d6c7}.btn{font-size:13px;font-weight:700}.card{fill:#fff;stroke:#d9e5df}.input{fill:#f8fbf9;stroke:#c9d9d1}.teal{fill:#0f766e}.bg{fill:#f3f7f4}.log{fill:#172522}</style></defs>
<rect width="1600" height="1080" fill="#eaf1ed"/>
<text x="68" y="58" class="t" font-size="14" font-weight="700" fill="#0f766e" letter-spacing="2">CODE REVIEW · THREE DIRECTIONS</text><text x="68" y="94" class="t" font-size="32" font-weight="700">代码检查页重新设计方案</text><text x="68" y="122" class="t muted body">同一套信息与功能，比较三种信息层级：配置清晰、结果优先、日志优先。</text>
<!-- A --> <g transform="translate(68,172)"><text class="t h" y="0">A · 控制台分区</text><text class="t muted body" y="27">配置、策略、执行分成三块，最适合日常维护。</text><rect y="52" width="470" height="770" rx="14" class="card"/><rect x="24" y="76" width="422" height="84" rx="10" fill="#edf6f1"/><text x="44" y="105" class="t label">检查任务</text><text x="44" y="136" class="t" font-size="18" font-weight="700">Unity 代码每日检查</text><rect x="338" y="96" width="86" height="28" rx="14" fill="#dff3e7"/><text x="355" y="115" class="t small" fill="#176b45">已成功</text><text x="24" y="195" class="t label">工程配置</text><text x="24" y="225" class="t muted small">工程地址</text><rect x="24" y="237" width="422" height="38" rx="7" class="input"/><text x="38" y="261" class="t small">D:\koa-client-code</text><text x="24" y="307" class="t muted small">Git 分支</text><rect x="24" y="319" width="180" height="38" rx="7" class="input"/><text x="38" y="343" class="t small">master</text><text x="24" y="398" class="t label">执行策略</text><rect x="24" y="418" width="422" height="42" rx="7" class="input"/><text x="38" y="444" class="t small">失败级别：高</text><text x="24" y="488" class="t small">☐ 允许 Skill 以外的规则检查</text><rect x="24" y="526" width="422" height="1" fill="#d9e5df"/><text x="24" y="564" class="t label">执行操作</text><rect x="24" y="582" width="124" height="40" rx="8" fill="#0f766e"/><text x="61" y="607" fill="#fff" class="t btn">执行检查</text><rect x="158" y="582" width="92" height="40" rx="8" fill="#eef4f0"/><text x="184" y="607" class="t btn">保存配置</text><text x="24" y="678" class="t label">最近一次成功</text><text x="24" y="708" class="t muted small">2026-11-18 20:40:41 · master</text><text x="24" y="766" class="t muted small">适合：配置项多、需要逐项确认的后台工具</text></g>
<!-- B --> <g transform="translate(565,172)"><text class="t h" y="0">B · 状态优先</text><text class="t muted body" y="27">先看检查结果，再处理配置；适合频繁查看结果。</text><rect y="52" width="470" height="770" rx="14" class="card"/><rect x="24" y="76" width="422" height="118" rx="10" fill="#e8f6ef"/><text x="44" y="108" class="t label">当前状态</text><text x="44" y="145" class="t" font-size="28" font-weight="700" fill="#176b45">检查成功</text><text x="44" y="171" class="t muted small">上次运行：2026-11-18 20:40:41 · 用时 02:18</text><rect x="24" y="222" width="422" height="54" rx="9" fill="#0f766e"/><text x="183" y="256" fill="#fff" class="t btn">立即执行检查</text><text x="24" y="324" class="t label">检查范围</text><text x="24" y="354" class="t muted small">工程</text><text x="112" y="354" class="t small">D:\koa-client-code</text><text x="24" y="385" class="t muted small">分支</text><text x="112" y="385" class="t small">master</text><text x="24" y="416" class="t muted small">规则</text><text x="112" y="416" class="t small">unity-code-review · 高失败级别</text><rect x="24" y="452" width="422" height="1" fill="#d9e5df"/><text x="24" y="490" class="t label">更多操作</text><rect x="24" y="510" width="110" height="38" rx="8" fill="#eef4f0"/><text x="52" y="534" class="t btn">编辑配置</text><rect x="144" y="510" width="110" height="38" rx="8" fill="#fff" stroke="#c9d9d1"/><text x="172" y="534" class="t btn">清空历史</text><rect x="24" y="590" width="422" height="156" rx="10" class="log"/><text x="42" y="620" class="mono">执行日志</text><text x="42" y="650" class="mono">[20:40:41] 任务执行完成</text><text x="42" y="675" class="mono">[20:38:23] 检查工程配置</text><text x="24" y="790" class="t muted small">适合：需要快速判断“现在是否正常”的用户</text></g>
<!-- C --> <g transform="translate(1062,172)"><text class="t h" y="0">C · 双栏工作区</text><text class="t muted body" y="27">左侧参数，右侧实时日志；适合长时间执行检查。</text><rect y="52" width="470" height="770" rx="14" class="card"/><rect x="24" y="76" width="178" height="670" rx="10" fill="#f5f9f6"/><text x="44" y="112" class="t label">检查配置</text><text x="44" y="148" class="t muted small">工程地址</text><rect x="44" y="160" width="138" height="38" rx="7" class="input"/><text x="54" y="184" class="t" font-size="11">koa-client-code</text><text x="44" y="230" class="t muted small">Git 分支</text><rect x="44" y="242" width="138" height="38" rx="7" class="input"/><text x="54" y="266" class="t small">master</text><text x="44" y="314" class="t muted small">失败级别</text><rect x="44" y="326" width="138" height="38" rx="7" class="input"/><text x="54" y="350" class="t small">高</text><text x="44" y="402" class="t muted small">Skill 路径</text><text x="44" y="430" class="t" font-size="11">unity-code-review</text><rect x="44" y="472" width="138" height="42" rx="8" class="teal"/><text x="78" y="498" fill="#fff" class="t btn">执行检查</text><text x="44" y="560" class="t muted small">状态</text><text x="44" y="589" class="t" font-size="16" font-weight="700" fill="#176b45">成功</text><rect x="220" y="76" width="226" height="670" rx="10" class="log"/><text x="240" y="112" fill="#fff" class="t label">实时日志</text><text x="240" y="148" class="mono">20:40:41 任务完成</text><text x="240" y="184" class="mono">20:39:32 规则检查中</text><text x="240" y="220" class="mono">20:38:23 读取配置</text><text x="240" y="256" class="mono">20:38:20 开始执行</text><text x="240" y="700" class="mono">滚动查看完整输出 →</text><text x="24" y="790" class="t muted small">适合：重视过程日志、需要边看边定位问题</text></g>
