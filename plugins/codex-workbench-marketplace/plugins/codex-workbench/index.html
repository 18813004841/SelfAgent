<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SelfAgent 插件</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#142746;background:#fff}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:48px 32px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{font-size:17px;letter-spacing:.12em;color:#315fae;font-weight:750}.versionbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid #d4e2f5;border-radius:24px;background:#f1f6fc;padding:8px 14px;font-size:14px}.versionbar button,.back{border:0;background:transparent;color:#1753af;font:inherit;font-weight:650;cursor:pointer}.versionbar button:disabled{opacity:.55;cursor:wait}button:focus-visible{outline:3px solid #83aaf0;outline-offset:3px}[hidden]{display:none!important}h1{font-size:38px;margin:52px 0 8px}p{line-height:1.6;color:#5a6d88}.intro{margin:0 0 36px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{display:flex;align-items:center;gap:22px;text-align:left;width:100%;min-height:150px;padding:24px;border:1px solid #cdddf1;border-radius:14px;background:#fff;color:inherit;cursor:pointer;font:inherit}.card:hover{background:#f7faff;border-color:#80a9df}.icon{display:grid;place-items:center;flex:none;width:68px;height:68px;border-radius:14px;background:#edf4fc;color:#1554b5;font-size:30px}.card strong{display:block;font-size:22px}.card small{display:block;color:#5a6d88;line-height:1.5;margin-top:8px;font-size:14px}.arrow{margin-left:auto;color:#1554b5;font-size:25px}#status{font-size:13px;color:#5a6d88;overflow-wrap:anywhere}.detail{margin-top:50px}.detail h1{margin:24px 0 8px}.detail-box{border:1px solid #d4e2f5;border-radius:14px;padding:16px;margin-top:16px}details summary{cursor:pointer;color:#315fae;font-weight:600}details p{margin:10px 0;font-size:14px}.back{padding:0}@media(max-width:650px){main{padding:28px 20px}.grid{grid-template-columns:1fr}h1{font-size:32px;margin-top:40px}.card{min-height:120px}}
.chat-progress{color:#62718a;font-size:13px;line-height:1.55}#chat{height:300px;overflow:auto;border:1px solid #d4e2f5;border-radius:10px;padding:12px;white-space:pre-wrap}.chat-head{display:flex;justify-content:space-between;margin:18px 0 10px}#chat-form{display:flex;gap:10px;margin-top:12px}#message{flex:1;min-height:65px;padding:10px;font:inherit}.small-note{font-size:13px}</style></head><body><main><header><div class="brand">SELFAGENT</div><div class="versionbar"><span id="version">加载中…</span><span id="status" role="status">正在连接插件…</span><button id="check">检查更新</button><button id="install" hidden>安装更新</button><button id="restart">重启 Codex</button></div></header><section id="home"><h1>功能中心</h1><p class="intro">选择功能，进入对应页面。</p><div class="grid" id="features"></div></section><section id="detail" class="detail" hidden><button class="back" id="back">← 返回功能中心</button><h1 id="detail-title"></h1><div class="detail-box" id="analysis" hidden><details><summary>工程配置</summary><label for="project-root">工程目录</label><p><input id="project-root" type="text" style="width:75%;padding:10px" placeholder="例如 D:\cn37"> <button id="bind">绑定工程</button> <button id="save-path">使用输入的路径</button></p><p id="project-status" role="status"></p></details><div class="chat-head"><strong>分析对话</strong><span><span id="mcp-status" role="status">MCP：未启动</span> <button id="start-mcp">启动工程 MCP</button> <button id="pause-chat">暂停对话</button> <button id="new-chat">新对话</button></span></div><div id="waiting" role="status"></div><div id="requests"></div><div id="chat" role="log" aria-live="polite"></div><div id="checking" class="chat-progress" role="status" hidden>正在检查工程<span id="checking-dots">…</span></div><div id="action-prompt" hidden role="status" style="border:1px solid #9dbde7;background:#f4f8ff;border-radius:8px;padding:12px;margin-top:10px;white-space:pre-wrap"><strong>需要你操作</strong><div id="action-text"></div></div><form id="chat-form"><textarea id="message" placeholder="输入问题或分析目标" required></textarea><button type="submit">发送</button></form><p class="small-note">启动工程 MCP 会创建分析会话并配置堆栈 MCP；实际连接状态需由 Codex 报告。Profiler MCP 已配置，连接及取消状态需实际验证。</p></div><div class="detail-box" id="placeholder"><p>这是功能页面占位，具体内容将在后续添加。</p></div></section></main><script>
(()=>{const features=[['代码辅助分析','绑定 Unity 工程，检查分析工具。','◇'],['功能二','展示另一类功能的入口示例。','▤'],['功能三','用于呈现数据或结果的入口示例。','▥'],['功能四','用于展示配置或管理类入口示例。','⚙']];const grid=document.getElementById('features');features.forEach(([name,description,icon])=>{const b=document.createElement('button');b.className='card';b.type='button';const i=document.createElement('span');i.className='icon';i.setAttribute('aria-hidden','true');i.textContent=icon;const content=document.createElement('span'),title=document.createElement('strong'),text=document.createElement('small'),arrow=document.createElement('span');title.textContent=name;text.textContent=description;content.append(title,text);arrow.className='arrow';arrow.setAttribute('aria-hidden','true');arrow.textContent='→';b.append(i,content,arrow);b.onclick=()=>{document.getElementById('home').hidden=true;document.getElementById('detail').hidden=false;document.getElementById('detail-title').textContent=name;document.getElementById('analysis').hidden=name!=='代码辅助分析';document.getElementById('placeholder').hidden=name==='代码辅助分析';if(name==='代码辅助分析')loadProject();};grid.append(b);});document.getElementById('back').onclick=()=>{document.getElementById('detail').hidden=true;document.getElementById('home').hidden=false;};let id=0;const pending=new Map(),$=x=>document.getElementById(x);function request(method,params,timeout=70000){return new Promise((resolve,reject)=>{const i=++id,t=setTimeout(()=>{pending.delete(i);reject(Error('宿主未响应'));},timeout);pending.set(i,{resolve,reject,t});window.parent.postMessage({jsonrpc:'2.0',id:i,method,params},'*');});}window.addEventListener('message',e=>{if(e.source!==window.parent||e.data?.jsonrpc!=='2.0')return;const p=pending.get(e.data.id);if(!p)return;pending.delete(e.data.id);clearTimeout(p.t);e.data.error?p.reject(Error(e.data.error.message||'请求失败')):p.resolve(e.data.result);});async function call(name,args={},timeout=70000){const r=await request('tools/call',{name,arguments:args},timeout),t=r?.content?.find(x=>x.type==='text')?.text||'';if(r?.isError)throw Error(t||'操作失败');return JSON.parse(t);}let cursor=0,started=false,polling=false;const states={notStarted:'未启动',starting:'连接中',connected:'已连接',authenticationRequired:'需要认证',failed:'连接失败',cancelled:'已取消',disabled:'已禁用',unknown:'状态未知',notFound:'未找到服务'};async function refreshMcp(){if(!started){$('mcp-status').textContent='MCP：未启动';return;}try{const d=await call('analysis_mcp_status');$('mcp-status').textContent='MCP：'+(states[d.status]||d.status)+(d.error?'（'+d.error+'）':'');}catch(e){$('mcp-status').textContent='MCP：状态查询失败（'+e.message+'）';}}function appendChat(text,kind='normal'){const span=document.createElement('span');if(kind==='progress')span.className='chat-progress';span.textContent=text;$('chat').append(span);$('chat').scrollTop=$('chat').scrollHeight;}let commandVisible=false,dotCount=0,markerBuffer='',actionMode=false;setInterval(()=>{if(commandVisible){dotCount=(dotCount+1)%4;$('checking-dots').textContent='.'.repeat(dotCount);}},500);function commandStatus(show){commandVisible=show;$('checking').hidden=!show;}function progressText(text){appendChat(text,actionMode?'normal':'progress');if(actionMode){$('action-text').append(document.createTextNode(text));$('action-prompt').hidden=false;}}function renderProgress(text){markerBuffer+=text;const markers=['【需要操作】','【操作提示结束】','【操作已完成】'];while(markerBuffer){let at=-1,which='';for(const m of markers){const n=markerBuffer.indexOf(m);if(n>=0&&(at<0||n<at)){at=n;which=m;}}if(at>=0){if(at)progressText(markerBuffer.slice(0,at));actionMode=which==='【需要操作】';if(which==='【操作已完成】'){$('action-prompt').hidden=true;$('action-text').textContent='';}if(actionMode){$('action-text').textContent='';$('action-prompt').hidden=false;appendChat('\n需要操作：\n');}markerBuffer=markerBuffer.slice(at+which.length);continue;}let keep=0;for(const m of markers)for(let n=1;n<m.length;n++)if(markerBuffer.endsWith(m.slice(0,n)))keep=Math.max(keep,n);if(markerBuffer.length>keep)progressText(markerBuffer.slice(0,markerBuffer.length-keep));markerBuffer=markerBuffer.slice(markerBuffer.length-keep);break;}}let requestSignature='';function renderRequests(requests){const signature=JSON.stringify(requests);if(signature===requestSignature)return;requestSignature=signature;const box=$('requests');box.replaceChildren();for(const r of requests){const panel=document.createElement('div');panel.style.cssText='border:1px solid #d4e2f5;padding:12px;margin:8px 0';const title=document.createElement('strong');title.textContent='需要处理：'+r.method;panel.append(title);const info=document.createElement('pre');info.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere';info.textContent=JSON.stringify(r.params,null,2);panel.append(info);let submitting=false;const send=async payload=>{if(submitting)return;submitting=true;panel.querySelectorAll('button').forEach(b=>b.disabled=true);const feedback=document.createElement('p');feedback.setAttribute('role','status');feedback.textContent='正在提交…';panel.append(feedback);try{await call('analysis_respond',{id:r.id,...payload});feedback.textContent='已提交，等待 Codex 继续。';panel.querySelectorAll('button').forEach(b=>b.disabled=true);}catch(e){feedback.textContent='提交失败：'+e.message;panel.querySelectorAll('button').forEach(b=>b.disabled=false);submitting=false;}};if(r.method==='item/commandExecution/requestApproval'||r.method==='item/fileChange/requestApproval'){for(const [label,decision] of [['允许','accept'],['拒绝','decline']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>send({decision});panel.append(b);}}else if(r.method==='item/tool/requestUserInput'){const fields=[];for(const q of r.params.questions||[]){const label=document.createElement('label');label.textContent=q.question;const input=document.createElement('input');input.type=q.isSecret?'password':'text';label.append(input);panel.append(label);fields.push([q.id,input]);}const b=document.createElement('button');b.textContent='提交答复';b.onclick=()=>send({answers:Object.fromEntries(fields.map(([id,input])=>[id,{answers:[input.value]}]))});panel.append(b);}else if(r.method==='mcpServer/elicitation/request'){if(r.params?.mode==='form'&&r.params?._meta?.codex_approval_kind==='mcp_tool_call'&&Object.keys(r.params?.requestedSchema?.properties||{}).length===0&&!(r.params?.requestedSchema?.required||[]).length){const allow=document.createElement('button');allow.textContent='允许本次调用';allow.onclick=()=>send({decision:'accept'});panel.append(allow);}const b=document.createElement('button');b.textContent='拒绝请求';b.onclick=()=>send({decision:'decline'});panel.append(b);}else{const note=document.createElement('p');note.textContent='此请求暂不支持，请暂停会话。';panel.append(note);}box.append(panel);}}async function pollChat(){if(polling||!started)return;polling=true;try{const d=await call('analysis_poll',{after:cursor});refreshMcp();renderRequests(d.requests||[]);$('waiting').textContent=(d.mcpCalls||[]).map(x=>`MCP ${x.server}：${x.tool} 已等待 ${Math.floor((Date.now()-x.since)/1000)} 秒`).join('；');for(const e of d.events){cursor=e.seq;if(e.type==='command_start'){commandStatus(true);continue;}if(e.type==='command_end'){commandStatus(false);continue;}commandStatus(false);if(e.type==='progress'){renderProgress(e.text);continue;}if(markerBuffer){appendChat(markerBuffer,actionMode?'normal':'progress');markerBuffer='';}appendChat(e.type==='delta'?e.text:`\n${e.text}\n`,e.type==='activity'?'progress':'normal');}}catch(e){appendChat(`\n${e.message}\n`);}finally{polling=false;if(started)setTimeout(pollChat,1000);}}$('start-mcp').onclick=async()=>{if(started){appendChat('\n当前会话已创建，已配置堆栈 MCP。\n');return;}try{await call('analysis_start');started=true;pollChat();appendChat('\n分析会话已创建，已配置工程堆栈 MCP；等待 Codex 确认连接状态。\n');}catch(e){appendChat(`\n启动失败：${e.message}\n`);}};$('pause-chat').onclick=async()=>{try{const d=await call('analysis_pause');appendChat(`\n${d.message}\n`);}catch(e){appendChat(`\n暂停失败：${e.message}\n`);}};$('new-chat').onclick=async()=>{try{await call('analysis_stop');started=false;cursor=0;markerBuffer='';actionMode=false;commandStatus(false);$('action-prompt').hidden=true;$('action-text').textContent='';$('chat').textContent='';await refreshMcp();}catch(e){appendChat(`\n停止失败：${e.message}\n`);}};$('chat-form').onsubmit=async e=>{e.preventDefault();const text=$('message').value.trim();if(!text)return;try{if(!started){await call('analysis_start');started=true;pollChat();}await call('analysis_send',{text});appendChat(`\n你：${text}\nCodex：`);$('message').value='';}catch(err){appendChat(`\n发送失败：${err.message}\n`);}};async function loadProject(root){try{const d=await call('analysis_project',root?{root}:{});if(!d){$('project-status').textContent='请先绑定工程目录。';return;}$('project-root').value=d.root;$('project-status').textContent=`堆栈工具：${d.trace?'已找到':'未找到'}；Profiler 工具：${d.profiler?'已找到':'未找到'}；Editor 扩展：${d.bridge?'已找到':'未找到'}；Profiler 录制状态：未知。`;}catch(e){$('project-status').textContent=e.message;}}$('save-path').onclick=()=>loadProject($('project-root').value);$('bind').onclick=async()=>{$('bind').disabled=true;$('project-status').textContent='请选择工程目录…';try{const d=await call('analysis_choose_project',{},310000);if(d.cancelled){$('project-status').textContent='已取消选择，工程绑定未改变。';}else{await loadProject();}}catch(e){$('project-status').textContent=e.message;}finally{$('bind').disabled=false;}};async function check(){$('check').disabled=true;$('install').hidden=true;$('status').textContent='正在检查更新…';try{const d=await call('plugin_check_updates');$('status').textContent=d.available?`发现新版本 ${d.latest}`:`插件源版本 ${d.latest}，当前无需更新。`;$('install').hidden=!d.available;}catch(e){$('status').textContent=`检查更新失败：${e.message}`;}finally{$('check').disabled=false;}}$('check').onclick=check;$('restart').onclick=async()=>{$('restart').disabled=true;try{const d=await call('plugin_restart');$('status').textContent=d.message;}catch(e){$('status').textContent=`重启失败：${e.message}`;$('restart').disabled=false;}};$('install').onclick=async()=>{$('install').disabled=true;$('check').disabled=true;$('status').textContent='正在安装更新…';try{const d=await call('plugin_install_update');$('status').textContent=d.message;$('install').hidden=true;}catch(e){$('status').textContent=`更新失败：${e.message}`;}finally{$('install').disabled=false;$('check').disabled=false;}};if(window.parent===window){$('status').textContent='未连接插件宿主';return;}request('ui/initialize',{appInfo:{name:'SelfAgent 插件',version:'1.0.19'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(async()=>{window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');const d=await call('plugin_info');$('version').textContent='v'+d.version;await check();}).catch(e=>{$('status').textContent=`插件连接失败：${e.message}`;});})();
</script></body></html>
