<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOA工作台</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#102040;background:#e9eff9;font-size:15px}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #8cb4f6;outline-offset:2px}[hidden]{display:none!important}.screen{min-height:100vh}.login{display:flex;flex-direction:column;max-width:460px;min-height:100vh;margin:auto;padding:42px 32px 24px}.login-body{margin:auto 0}.login h1{font-size:34px;margin:0 0 8px}.subtitle,.muted{color:#627596;line-height:1.6}.field{display:block;font-weight:600;margin:20px 0 7px}.input{width:100%;border:1px solid #b5c6df;border-radius:8px;padding:13px;background:#f8fbff;color:#13213c}.primary,.secondary{border:0;border-radius:8px;padding:11px 18px;font-weight:600}.primary{background:#365fae;color:white}.secondary{background:#e2eafb;color:#244875}.full{width:100%;margin-top:22px}.login-footer{border-top:1px solid #d1dced;padding-top:20px}.small{font-size:13px}.text-button{border:0;background:transparent;color:#285bb4;padding:3px 0}.dashboard{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh}.sidebar{background:#eef3fb;border-right:1px solid #d4dfee;padding:24px 14px;display:flex;flex-direction:column;gap:8px}.brand{font-size:21px;font-weight:750;margin:0 10px 25px}.nav{border:0;background:transparent;color:#243b5a;text-align:left;border-radius:8px;padding:12px 14px}.nav.active{background:#d9e6f8;color:#102040;font-weight:700}.spacer{flex:1}.main{display:flex;flex-direction:column;min-width:0}.topbar{height:70px;background:#f3f6fb;border-bottom:1px solid #d5dfed;display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:15px}.topbar h2{font-size:20px;margin:0}.content{padding:30px 32px;flex:1}.content h1{font-size:30px;margin:0 0 8px}.surface{background:#f2f6fc;border:1px solid white;border-radius:14px;padding:22px;margin-top:20px}.machine{font-size:21px;font-weight:700;margin:6px 0}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{background:#f2f6fc;border:1px solid white;border-radius:14px;padding:20px;margin-top:12px;min-width:0}.metric strong{display:block;font-size:24px;margin-top:6px;overflow-wrap:anywhere}.versionbar{background:#f1f5fb;border-top:1px solid #d5dfed;padding:16px 32px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.status{color:#a12f30;min-height:1.4em;margin:10px 0;overflow-wrap:anywhere}.hint{color:#526a8a}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.address{overflow-wrap:anywhere}.empty{padding:16px 0;color:#627596}.row{padding:12px 0;border-bottom:1px solid #dce5f1}.row:last-child{border:0}button:disabled{opacity:.55;cursor:wait}@media(max-width:620px){.dashboard{grid-template-columns:1fr}.sidebar{padding:12px;display:flex;flex-direction:row;overflow:auto}.brand{margin:8px 15px 8px 0;white-space:nowrap}.sidebar .spacer{display:none}.nav{white-space:nowrap}.topbar{padding:0 20px}.content{padding:24px 20px}.metrics{grid-template-columns:1fr}.versionbar{padding:16px 20px}}
</style></head><body>
<section id="login-screen" class="screen login" hidden><div class="login-body"><h1>KOA工作台</h1><p class="subtitle">连接工作台，管理你的任务与资源。</p><form id="login-form"><label class="field" for="username">账号</label><input class="input" id="username" autocomplete="username" required><label class="field" for="password">密码</label><input class="input" id="password" type="password" autocomplete="current-password" required><p id="transport-warning" class="small muted" hidden>当前使用 HTTP，登录信息在网络传输时未加密。</p><button id="login-button" class="primary full" type="submit">登录</button><p id="login-status" class="status" role="status"></p></form><button id="login-settings" class="text-button" type="button">服务器设置</button>　<button class="text-button open-workbench" type="button">打开工作台 ↗</button><p id="login-open-status" class="status" role="status"></p></div><div class="login-footer"><span class="version-label small muted"></span>　<span class="update-label small"></span>　<button class="text-button check-update" type="button">检查更新</button>　<button class="text-button install-update" type="button" hidden>更新</button></div></section>
<section id="dashboard" class="screen dashboard" hidden><aside class="sidebar"><div class="brand">KOA工作台</div><button class="nav active" data-page="overview">总览</button><button class="nav" data-page="scheduler">定时任务</button><button class="nav" data-page="tasks">任务</button><button class="nav" data-page="manage">管理</button><button class="nav" data-page="settings">设置</button><div class="spacer"></div><button id="logout" class="nav">退出登录</button></aside><div class="main"><header class="topbar"><h2 id="page-title">总览</h2><button class="text-button open-workbench" type="button">打开工作台 ↗</button></header><main class="content"><p id="main-open-status" class="status" role="status"></p><div id="page-overview"><h1>本机概览</h1><p class="muted">显示工作台服务所在机器的信息。</p><div class="surface"><div class="muted small">机器</div><div id="hostname" class="machine">—</div><p id="system" class="muted">—</p><button id="refresh" class="secondary">刷新状态</button><p id="overview-status" class="status" role="status"></p></div><div class="metrics"><div class="metric"><span class="muted">内存使用率</span><strong id="memory">—</strong></div><div class="metric"><span class="muted">磁盘使用率</span><strong id="disk">—</strong></div><div class="metric"><span class="muted">本机地址</span><strong id="ip">—</strong></div></div></div><div id="page-scheduler" hidden><h1>定时任务</h1><p class="muted">查看工作台中的定时任务。</p><div id="schedule-list" class="surface"></div><p id="schedule-status" class="status" role="status"></p><button id="reload-schedules" class="secondary">刷新</button></div><div id="page-tasks" hidden><h1>任务</h1><p class="muted">工作台任务页面尚未提供内容，请在工作台中查看其他功能。</p></div><div id="page-manage" hidden><h1>管理</h1><p class="muted">管理操作请在工作台中进行。</p><button class="secondary open-workbench" type="button">打开工作台 ↗</button></div><div id="page-settings" hidden><h1>服务器设置</h1><p class="muted">更改地址后将退出当前会话。</p><div class="surface"><label class="field" for="server-url">工作台服务器地址</label><input class="input" id="server-url" type="url" autocomplete="url"><div class="buttons"><button id="save" class="primary">保存地址</button><button id="test" class="secondary">测试连接</button><button id="back-login" class="secondary" hidden>返回登录</button></div><p id="settings-status" class="status" role="status"></p></div></div></main><footer class="versionbar"><span><span class="version-label"></span> · <span class="update-label">尚未检查更新</span>　<button class="text-button check-update">检查更新</button></span><button class="primary install-update" hidden>更新</button></footer></div></section>
<script>
(()=>{const $=id=>document.getElementById(id), all=q=>document.querySelectorAll(q);let id=0,savedUrl='',currentUser=null;const pending=new Map();
function request(method,params,timeout=12000){return new Promise((resolve,reject)=>{const i=++id,t=setTimeout(()=>{pending.delete(i);reject(Error('宿主未响应'));},timeout);pending.set(i,{resolve,reject,t});window.parent.postMessage({jsonrpc:'2.0',id:i,method,params},'*');});}
window.addEventListener('message',e=>{if(e.source!==window.parent||e.data?.jsonrpc!=='2.0')return;const p=pending.get(e.data.id);if(!p)return;pending.delete(e.data.id);clearTimeout(p.t);e.data.error?p.reject(Error(e.data.error.message||'请求失败')):p.resolve(e.data.result);});
async function call(name,args={}){const r=await request('tools/call',{name,arguments:args},45000),t=r?.content?.find(x=>x.type==='text')?.text||'';if(r?.isError)throw Error(t||'操作失败');return JSON.parse(t);}
function display(user){currentUser=user;$('login-screen').hidden=!!user;$('dashboard').hidden=!user;if(user){page('overview');}else{$('password').value='';for(const key of ['hostname','system','memory','disk','ip'])$(key).textContent='—';} }
function page(name){$('login-screen').hidden=true;$('dashboard').hidden=false;for(const n of ['overview','scheduler','tasks','manage','settings'])$('page-'+n).hidden=n!==name;for(const b of all('.nav[data-page]')){b.hidden=!currentUser;b.classList.toggle('active',b.dataset.page===name);}$('page-title').textContent={overview:'总览',scheduler:'定时任务',tasks:'任务',manage:'管理',settings:'设置'}[name];$('logout').hidden=!currentUser;$('back-login').hidden=!!currentUser;if(name==='overview')loadOverview();if(name==='scheduler')loadSchedules();}
function setAddress(url){savedUrl=url;$('server-url').value=url;$('transport-warning').hidden=!url.startsWith('http:');}
async function loadOverview(){$('overview-status').textContent='正在加载…';try{const d=await call('workbench_overview'),m=d.metrics||{};$('hostname').textContent=d.machine.hostname||'—';$('system').textContent=d.machine.os||'—';$('memory').textContent=m.memory?.percent!=null?m.memory.percent+'%':'—';$('disk').textContent=(m.disks||[]).map(x=>`${x.mount} ${x.percent}%`).join('、')||'—';$('ip').textContent=(m.ips||[]).join('、')||'—';$('overview-status').textContent='';}catch(e){if(e.message.includes('请先登录')||e.message.includes('登录已失效')){display(null);$('login-status').textContent=e.message;}else $('overview-status').textContent=e.message;}}
async function loadSchedules(){$('schedule-status').textContent='正在加载…';$('schedule-list').replaceChildren();try{const d=await call('workbench_schedules');if(!d.tasks?.length){$('schedule-list').textContent='暂无定时任务';}else for(const t of d.tasks){const row=document.createElement('div');row.className='row';row.textContent=t.name||t.scheduler_type||t.id||'未命名任务';$('schedule-list').append(row);}$('schedule-status').textContent='';}catch(e){if(e.message.includes('请先登录')||e.message.includes('登录已失效')){display(null);$('login-status').textContent=e.message;}else $('schedule-status').textContent=e.message;}}
async function checkUpdates(){all('.update-label').forEach(e=>e.textContent='正在检查更新…');all('.install-update').forEach(e=>e.hidden=true);try{const d=await call('workbench_check_updates');all('.update-label').forEach(e=>e.textContent=d.available?`发现新版本 ${d.latest}`:'已是最新版本');all('.install-update').forEach(e=>e.hidden=!d.available);}catch(e){all('.update-label').forEach(x=>x.textContent=`更新检查失败：${e.message}`);}}
const connected=window.parent!==window?request('ui/initialize',{appInfo:{name:'KOA工作台',version:'0.0.4'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*')):Promise.reject(Error('未连接插件宿主'));
connected.then(async()=>{const d=await call('get_workbench_settings');setAddress(d.url);all('.version-label').forEach(x=>x.textContent=`当前版本 ${d.version}`);try{display((await call('workbench_session')).user);}catch(e){display(null);$('login-status').textContent=e.message;}checkUpdates();}).catch(e=>{display(null);$('login-status').textContent=`插件连接失败：${e.message}`;});
$('login-form').addEventListener('submit',async e=>{e.preventDefault();$('login-button').disabled=true;$('login-status').textContent='正在登录…';try{const d=await call('workbench_login',{username:$('username').value,password:$('password').value});$('password').value='';$('login-status').textContent='';display(d.user);}catch(err){$('password').value='';$('login-status').textContent=err.message;}finally{$('login-button').disabled=false;}});
$('logout').onclick=async()=>{try{await call('workbench_logout');}catch(e){$('login-status').textContent=e.message;}display(null);};$('login-settings').onclick=()=>page('settings');$('back-login').onclick=()=>display(null);all('.nav[data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));$('refresh').onclick=loadOverview;$('reload-schedules').onclick=loadSchedules;
$('save').onclick=async()=>{try{const d=await call('save_workbench_settings',{url:$('server-url').value});setAddress(d.url);$('settings-status').textContent=d.changed?'地址已保存，请重新登录。':'地址已保存。';if(d.changed){currentUser=null;for(const b of all('.nav[data-page]'))b.hidden=true;$('logout').hidden=true;$('back-login').hidden=false;}}catch(e){$('settings-status').textContent=e.message;}};
$('test').onclick=async()=>{$('settings-status').textContent='正在测试连接…';try{await call('test_workbench_connection',{url:$('server-url').value});$('settings-status').textContent='连接成功。';}catch(e){$('settings-status').textContent=`连接失败：${e.message}`;}};
all('.open-workbench').forEach(b=>b.onclick=async()=>{const target=currentUser?'main-open-status':'login-open-status';$(target).textContent='正在打开浏览器…';try{await call('workbench_open_external');$(target).textContent='已请求打开浏览器。';}catch(e){$(target).textContent=`${e.message}：${savedUrl}`;}});
all('.check-update').forEach(b=>b.onclick=checkUpdates);all('.install-update').forEach(b=>b.onclick=async()=>{b.disabled=true;all('.update-label').forEach(x=>x.textContent='正在安装更新…');try{const d=await call('workbench_install_update');all('.update-label').forEach(x=>x.textContent=d.message);all('.install-update').forEach(x=>x.hidden=true);}catch(e){all('.update-label').forEach(x=>x.textContent=`更新失败：${e.message}；请退出 Codex 后重试。`);}finally{b.disabled=false;}});
})();
</script></body></html>
