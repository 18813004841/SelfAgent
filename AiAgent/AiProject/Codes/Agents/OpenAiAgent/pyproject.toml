[project]
name = "openai-codex-agent"
version = "0.1.0"
description = "A small OAuth-authenticated Codex agent CLI"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.scripts]
codex-agent = "codex_agent.cli:main"

[project.optional-dependencies]
langchain = [
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
]
test = [
  "pytest>=8",
  "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
